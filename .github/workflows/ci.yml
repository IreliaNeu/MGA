name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      # Match the accepted core gate; archived one-off scripts are not Ruff-clean.
      - run: ruff check src tests
      - run: ruff check scripts/analyze_heldout_human_validity.py scripts/audit_server_recovery.py scripts/build_paper_experiments.py scripts/evaluate_semantic_parser_v2.py
      - run: pytest
      - run: python scripts/build_paper_experiments.py --check
