[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mga-eval"
version = "0.1.0"
description = "Mask-Guided Alignment v2 for spatiotemporal change-caption evaluation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "IreliaNeu" }]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]
gpu = [
  "accelerate>=0.33",
  "safetensors>=0.4",
  "torch>=2.1",
  "transformers>=4.44",
]
llm = [
  "openai>=1.40",
]
all = [
  "mga-eval[dev,gpu,llm]",
]

[project.scripts]
mga = "mga.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

